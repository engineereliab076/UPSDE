version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dar_es_Salaam
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      safe-npm-updates:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - react
          - react-dom
          - "@sentry/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dar_es_Salaam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      safe-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

